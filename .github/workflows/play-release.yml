name: Publish Signed Scripting Academy AAB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  play-release:
    runs-on: ubuntu-latest
    env:
      HAS_PLAY_SIGNING: ${{ secrets.PLAY_STORE_KEYSTORE_BASE64 != '' && secrets.PLAY_STORE_KEYSTORE_PASSWORD != '' && secrets.PLAY_STORE_KEY_ALIAS != '' && secrets.PLAY_STORE_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Require Play signing secrets
        shell: bash
        run: |
          if [ "$HAS_PLAY_SIGNING" != "true" ]; then
            echo "ERROR: Play signing secrets are not configured."
            echo "Configure PLAY_STORE_KEYSTORE_BASE64, PLAY_STORE_KEYSTORE_PASSWORD, PLAY_STORE_KEY_ALIAS and PLAY_STORE_KEY_PASSWORD in GitHub repository Actions secrets."
            exit 1
          fi

      - name: Decode Play upload keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_STORE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > play-upload.jks

      - name: Build signed release AAB
        env:
          PLAY_STORE_KEYSTORE_BASE64: ${{ secrets.PLAY_STORE_KEYSTORE_BASE64 }}
          PLAY_STORE_KEYSTORE_PASSWORD: ${{ secrets.PLAY_STORE_KEYSTORE_PASSWORD }}
          PLAY_STORE_KEY_ALIAS: ${{ secrets.PLAY_STORE_KEY_ALIAS }}
          PLAY_STORE_KEY_PASSWORD: ${{ secrets.PLAY_STORE_KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon

      - name: Verify AAB is signed
        run: |
          jarsigner -verify -verbose app/build/outputs/bundle/release/app-release.aab
          echo "SIGNED AAB VERIFIED"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Scripting-Academy-V25-Play-Signed
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v25.0
          name: Scripting Academy V25.0 — Signed Play Build
          body: Signed Play upload AAB for Scripting Academy V25.0. Target SDK 36.
          files: app/build/outputs/bundle/release/app-release.aab
          overwrite_files: true

name: Build and Release Scripting Academy
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_PLAY_SIGNING: ${{ secrets.PLAY_STORE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Decode Play upload keystore
        if: env.HAS_PLAY_SIGNING == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_STORE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > play-upload.jks
      - name: Verify signing secrets
        if: env.HAS_PLAY_SIGNING == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.PLAY_STORE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_STORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_STORE_KEY_PASSWORD }}
        run: test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Build Play release AAB
        run: gradle bundleRelease --no-daemon
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Scripting-Academy-V21-builds
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Publish V21 signed release
        if: ${{ github.event_name == 'push' && env.HAS_PLAY_SIGNING == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v21.0
          name: Scripting Academy V21.0 — Play-ready
          body: Play-ready AAB, target SDK 36, real lab functionality.
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true

name: Build Scripting Academy APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build V17 APK
        run: gradle assembleDebug --no-daemon
      - name: Upload V17 APK
        uses: actions/upload-artifact@v4
        with:
          name: Scripting-Academy-APK-V17
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish V17 Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Release Scripting Academy V17 REAL Lab APK')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v17.0
          name: Scripting Academy V17.0 — REAL LAB
          body: |
            Scripting Academy V17.0.

            REAL Android JavaScript execution.
            REAL Windows Lab Agent integration for C, C++, Python and Node.js.
            REAL allowlisted Windows learning terminal.
            No simulated execution is reported as real.
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true

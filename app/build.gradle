plugins { id 'com.android.application' }

def hasReleaseSigning = [System.getenv('PLAY_STORE_KEYSTORE_BASE64'), System.getenv('PLAY_STORE_KEYSTORE_PASSWORD'), System.getenv('PLAY_STORE_KEY_ALIAS'), System.getenv('PLAY_STORE_KEY_PASSWORD')].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.shreebalaji.scriptingacademy'
    compileSdk 36
    defaultConfig {
        applicationId 'com.shreebalaji.scriptingacademy'
        minSdk 24
        targetSdk 36
        versionCode 25
        versionName '25.0'
    }
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(project.rootDir.toString() + '/play-upload.jks')
                storePassword System.getenv('PLAY_STORE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PLAY_STORE_KEY_ALIAS')
                keyPassword System.getenv('PLAY_STORE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) { signingConfig signingConfigs.release }
        }
    }
}

dependencies { implementation 'androidx.webkit:webkit:1.17.1' }
